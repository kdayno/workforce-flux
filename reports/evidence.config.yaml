appearance:
  default: system
  switcher: true

theme:
  # Warm Earth palette (vibrant) -- richer terracotta + clear slate + vivid sage.
  # Same character as the muted version, more saturation for stronger contrast.
  colorPalettes:
    default:
      light:
        - "#d65a1f"  # rich terracotta
        - "#2f5582"  # strong slate
        - "#4b9d6b"  # vivid sage
        - "#c89540"  # golden ochre
        - "#8a5fb0"  # rich plum
        - "#357c9e"  # clear teal
        - "#dc8e4a"  # warm amber
        - "#c84a4a"  # clear coral
      dark:
        - "#f07a3f"  # bright terracotta
        - "#5a7eaa"  # bright slate
        - "#7cba8d"  # bright sage
        - "#dfae5e"  # bright ochre
        - "#a982c8"  # bright plum
        - "#5fa5c8"  # bright teal
        - "#f0a868"  # bright amber
        - "#e26a6a"  # bright coral
  colorScales:
    default:
      light:
        - "#fce9c8"  # pale warm cream
        - "#9c3a10"  # deep rich terracotta
      dark:
        - "#3a4f6a"  # dark slate
        - "#ff8847"  # very bright terracotta
  colors:
    primary:
      light: "#2f5582"  # strong slate
      dark: "#5a7eaa"   # bright slate
    accent:
      light: "#d65a1f"  # rich terracotta
      dark: "#f07a3f"   # bright terracotta
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#0284c7"
      dark: "#38bdf8"
    positive:
      light: "#16a34a"
      dark: "#4ade80"
    warning:
      light: "#f8c900"
      dark: "#fbbf24"
    negative:
      light: "#dc2626"
      dark: "#f87171"

plugins:
  components:
    # This loads all of evidence's core charts and UI components
    # You probably don't want to edit this dependency unless you know what you are doing
    "@evidence-dev/core-components": {}

  datasources:
    # You can add additional datasources here by adding npm packages. 
    # Make to also add them to `package.json`.
    "@evidence-dev/bigquery": { }
    "@evidence-dev/csv": { }
    "@evidence-dev/databricks": { }
    "@evidence-dev/duckdb": { }
    "@evidence-dev/mssql": { }
    "@evidence-dev/mysql": { }
    "@evidence-dev/postgres": { }
    "@evidence-dev/source-javascript": { }
    "@evidence-dev/snowflake": { }
    "@evidence-dev/sqlite": { }
    "@evidence-dev/trino": { }
    "@evidence-dev/motherduck": { }
